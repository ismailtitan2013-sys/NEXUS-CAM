name: Build Windows app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/NexusCam/NexusCam.csproj
      - name: Build
        run: dotnet build src/NexusCam/NexusCam.csproj -c Release --no-restore
      - name: Publish self-contained x64
        run: dotnet publish src/NexusCam/NexusCam.csproj -c Release -r win-x64 --self-contained true -o artifacts/NEXUS-CAM
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-CAM-Windows-x64
          path: artifacts/NEXUS-CAM/
